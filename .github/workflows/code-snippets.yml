name: Code Snippets

on:
  pull_request:
    branches:
      - master
    paths:
      - 'content/**/*.mdx'
      - 'solutions/**/*.mdx'
      - 'scripts/check-code-snippets.ts'

jobs:
  code-snippets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the base branch to diff against
      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          corepack: true
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn

      # Only the snippets in files this PR touches, so existing breakage
      # elsewhere doesn't block unrelated work.
      - name: Check code snippets in changed files
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: yarn check-code-snippets
